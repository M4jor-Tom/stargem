syntax = "proto3";

package stargem.grpc.spectator;

import "quic/combat.proto";

service SpectatorService {
  rpc Subscribe(SubscribeRequest) returns (stream quic.combat.GameStateSnapshot);
  rpc ListMatches(ListMatchesRequest) returns (ListMatchesResponse);
}

message SubscribeRequest {
  string match_id = 1;
}

message ListMatchesRequest {}

message ListMatchesResponse {
  repeated MatchInfo matches = 1;
}

message MatchInfo {
  string match_id = 1;
  repeated string player_ids = 2;
  uint32 tick_number = 3;
}